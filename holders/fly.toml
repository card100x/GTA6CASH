app = "gtasix-holders"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "holders_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # exactly one machine: two would pay holders twice
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
