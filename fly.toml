app = "gtasix-relay"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "relay_data"
  destination = "/app/relay/data"

[http_service]
  internal_port = 8080
  force_https = true
  # one always-on machine: the relay must keep polling and must never run twice
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
